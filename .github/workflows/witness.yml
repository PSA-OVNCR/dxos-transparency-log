#
# Witness tự động trong repo neo (spec 11.4). Chỉ chạy khi đã đặt biến repo DXOS_SERVER
# (Settings → Secrets and variables → Actions → Variables), ví dụ https://dxos.example.
# Biến DXOS_REF (tùy chọn): tag/nhánh của PSA-OVNCR/dxos để cài dxos-witness, mặc định v0.1.0.
# Witness này nằm trong tổ chức của đội nên KHÔNG độc lập trước mối đe dọa X4; witness độc lập xem repo dxos-witness-kit.
name: witness
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: ${{ vars.DXOS_SERVER != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: anchor }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cài dxos-witness
        env:
          REF: ${{ vars.DXOS_REF || 'v0.1.0' }}
        run: |
          python -m pip install \
            "dxos-proof @ git+https://github.com/PSA-OVNCR/dxos@${REF}#subdirectory=libs/dxos-proof" \
            "dxos-witness @ git+https://github.com/PSA-OVNCR/dxos@${REF}#subdirectory=witness"
      - name: Khôi phục STH đã kiểm lần trước
        uses: actions/cache@v4
        with:
          path: state
          key: witness-state-${{ github.run_id }}
          restore-keys: witness-state-
      - name: Kiểm
        run: dxos-witness sync --server "${{ vars.DXOS_SERVER }}" --anchor-dir anchor --state-dir state --no-pull
